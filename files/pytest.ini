[pytest]
testpaths = .
python_files = test_phase*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    phase1: Environment setup and knowledge base
    phase2: RAG pipeline
    phase3: SM2 spaced repetition engine
    phase4: Android front-end
    phase5: Offline sync layer
    phase6: Integration testing and benchmarking
