name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0

    - name: Ensure Git LFS objects (models)
      run: |
        git lfs install --local
        # Try to pull only models; fallback to full pull if partial fails
        git lfs pull --include="models/*" || git lfs pull
        echo "--- LFS tracked files ---"
        git lfs ls-files || true
        echo "--- models directory ---"
        ls -lh models/ || true

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf automake libtool libtool-bin pkg-config \
          zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
          cython3 libltdl-dev m4 swig
        echo "✓ System dependencies installed"

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        # Pin python-for-android to a specific, stable release:
        pip install --upgrade "python-for-android==2024.12.0"
        echo "✓ Buildozer installed"

    - name: Verify model file (Git LFS)
      run: |
        MODEL="models/SmolLM2-360M-Instruct-Q4_K_M.gguf"
        if [ ! -f "$MODEL" ]; then
          echo "::error::Model not found: $MODEL"
          ls -lah models || true
          exit 1
        fi
        # Print the first few lines to detect pointer file
        echo "--- model head ---"
        head -n 20 "$MODEL" || true
        SIZE=$(stat -c%s "$MODEL" || echo 0)
        if [ "$SIZE" -lt 200000000 ]; then
          echo "::error::Model too small ($SIZE bytes) — LFS pull may have failed or file is a pointer"
          exit 1
        fi
        echo "✓ Model verified: $(du -h "$MODEL" | cut -f1) ($SIZE bytes)"

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Build Android APK
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
        CFLAGS: "-O2 -fPIC"
      run: |
        set -o pipefail
        echo "========================================="
        echo "Starting Android APK build..."
        echo "========================================="
        yes | buildozer android debug 2>&1 | tee build.log
        echo "✓ Build completed successfully"

    - name: Verify APK was created
      run: |
        echo "--- Searching for APK files ---"
        find . -name "*.apk" -type f -exec ls -lh {} \;
        if ! ls bin/*.apk 1>/dev/null 2>&1; then
          echo "::error::No APK found in bin/ — build may have failed silently"
          echo "--- Last 100 lines of build log ---"
          tail -100 build.log
          exit 1
        fi
        echo "✓ APK found:"
        ls -lh bin/*.apk

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ZIDON-AI-Tutor-APK
        path: bin/*.apk
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
