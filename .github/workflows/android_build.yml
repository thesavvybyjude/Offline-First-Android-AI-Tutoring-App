name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0

    - name: Ensure Git LFS objects
      run: |
        git lfs install --local || true
        git lfs pull --include="models/*" || true
        echo "--- Git LFS files after pull ---"
        git lfs ls-files || true

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git git-lfs zip unzip openjdk-17-jdk \
          autoconf automake libtool libtool-bin pkg-config \
          zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
          cython3 libltdl-dev m4 swig
        echo "✓ System dependencies installed"

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        # Use latest available release of python-for-android
        pip install --upgrade python-for-android
        echo "✓ Buildozer installed"

    - name: Verify model file (Git LFS)
      run: |
        echo "--- models/ directory ---"
        ls -lh models/ || echo "models/ directory not found"
        echo ""
        MODEL="models/SmolLM2-360M-Instruct-Q4_K_M.gguf"
        if [ ! -f "$MODEL" ]; then
          echo "::warning::Model not found: $MODEL — skipping model verification in CI. This large model should be downloaded at runtime or stored externally."
        else
          SIZE=$(stat -c%s "$MODEL" || echo 0)
          if [ "$SIZE" -lt 200000000 ]; then
            echo "::warning::Model too small ($SIZE bytes) — LFS pull may have failed; continuing"
          else
            echo "✓ Model verified: $(du -h "$MODEL" | cut -f1) ($SIZE bytes)"
          fi
        fi

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Build Android APK
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
        CFLAGS: "-O2 -fPIC"
      run: |
        set -o pipefail
        echo "========================================="
        echo "Starting Android APK build..."
        echo "========================================="
        yes | buildozer android debug 2>&1 | tee build.log
        echo "✓ Build completed successfully"

    - name: Verify APK was created
      run: |
        echo "--- Searching for APK files ---"
        find . -name "*.apk" -type f -exec ls -lh {} \;
        if ! ls bin/*.apk 1>/dev/null 2>&1; then
          echo "::error::No APK found in bin/ — build may have failed silently"
          echo "--- Last 100 lines of build log ---"
          tail -100 build.log
          exit 1
        fi
        echo "✓ APK found:"
        ls -lh bin/*.apk

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ZIDON-AI-Tutor-APK
        path: bin/*.apk
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
