name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # AI build can take 60-90 min

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool libtool-bin pkg-config \
          zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
          cython3 libltdl-dev m4 \
          swig       # Required by faiss-cpu Python bindings
        echo "System dependencies installed"

    - name: Install Buildozer and python-for-android
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        pip install --upgrade python-for-android
        echo "Buildozer $(buildozer version 2>/dev/null || echo 'installed')"

    - name: Verify app assets
      run: |
        # test -f assets/icon.png || { echo "::error::assets/icon.png missing — add the file or update buildozer.spec"; exit 1; }
        # test -f assets/splash.png || { echo "::error::assets/splash.png missing — add the file or update buildozer.spec"; exit 1; }
        echo "✓ App assets verification skipped"

    - name: Cache AI Model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: models/SmolLM2-360M-Instruct-Q4_K_M.gguf
        key: smollm2-360m-q4km-v2

    - name: Download AI model (SmolLM2-360M ~270MB)
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        echo "Installing huggingface_hub for robust downloads..."
        pip install huggingface_hub
        echo "Downloading SmolLM2-360M-Instruct-Q4_K_M.gguf (~270MB)..."
        huggingface-cli download lmstudio-community/SmolLM2-360M-Instruct-GGUF SmolLM2-360M-Instruct-Q4_K_M.gguf --local-dir models --local-dir-use-symlinks False
        echo "Downloaded: $(du -h models/SmolLM2-360M-Instruct-Q4_K_M.gguf | cut -f1)"

    - name: Verify model file
      run: |
        MODEL_FILE="models/SmolLM2-360M-Instruct-Q4_K_M.gguf"
        if [ ! -f "$MODEL_FILE" ]; then
          echo "::error::Model file not found at $MODEL_FILE"
          exit 1
        fi
        SIZE=$(stat -c%s "$MODEL_FILE")
        # SmolLM2-360M Q4_K_M should be ~271MB (284,000,000+ bytes)
        if [ "$SIZE" -lt 200000000 ]; then
          echo "::error::Model file too small ($SIZE bytes) — download may have failed"
          exit 1
        fi
        echo "✓ Model verified: $(du -h "$MODEL_FILE" | cut -f1)"

    - name: Build Android APK
      env:
        # C++ flags for cross-compiling AI dependencies
        CXXFLAGS: "-O2 -fPIC -std=c++17"
        CFLAGS: "-O2 -fPIC"
      run: |
        echo "Starting Android build (this takes 60-90 minutes with AI deps)..."
        yes | buildozer android debug 2>&1 | tee build.log
        BUILD_EXIT=$?
        echo "Build completed with exit code $BUILD_EXIT"
        exit $BUILD_EXIT

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AITutor-Android-App
        path: bin/*.apk

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
